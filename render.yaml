# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: humanity-vs-stockfish
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: STOCKFISH_SKILL
        value: "10"
      - key: VOTE_SECONDS
        value: "300"
      # Free Upstash Redis keeps the counters safe across restarts.
      # Render asks you to paste these when you create the Blueprint.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
